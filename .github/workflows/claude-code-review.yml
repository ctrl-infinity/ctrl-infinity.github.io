name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Report Claude execution error
        if: ${{ failure() && steps.claude-review.outcome == 'failure' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = process.env.CLAUDE_EXECUTION_FILE ||
            path.join(process.env.RUNNER_TEMP, 'claude-execution-output.json');
          const messages = JSON.parse(fs.readFileSync(file, 'utf8'));
          const result = messages.findLast(message => message.type === 'result');
          if (!result || !result.is_error) {
            throw new Error('No Claude error result found; inspect the preceding action logs.');
          }
          const error = result.result || result.errors?.join('\n');
          if (!error) {
            throw new Error('Claude returned an error without an error message.');
          }
          console.error(`Claude error: ${JSON.stringify(error)}`);
          NODE
